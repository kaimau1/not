<!DOCTYPE html>
<html lang="tr">
<head>
  <!--
    $FLUTTER_BASE_HREF, `flutter build web --base-href` değeriyle değiştirilir.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Notlar — akıllı not defteri</title>
  <meta name="description" content="Notlar: telefon, tablet, bilgisayar ve web arasında anında senkron olan akıllı not defteri. Yapay zekâ asistanı, el yazısı, PDF üstüne not, notta YouTube videosu, çok sayfalı notlar, ortak notlar ve klasörler.">
  <meta name="application-name" content="Notlar">
  <meta name="theme-color" content="#F3EFE3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E0E11" media="(prefers-color-scheme: dark)">

  <!-- Paylaşım önizlemesi (bağlantı mesajlaşmada/sosyal medyada açılınca) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Notlar">
  <meta property="og:title" content="Notlar — akıllı not defteri">
  <meta property="og:description" content="Her cihazda aynı notlar. Yapay zekâ asistanı, el yazısı, PDF üstüne not, notta YouTube videosu ve canlı ortak notlar.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta name="twitter:card" content="summary">

  <!-- iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Notlar">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <!--
    AÇILIŞ EKRANI (2026-09-22, web tasarımı): Flutter motoru indirilip ilk
    kareyi çizene kadar sayfa bembeyaz duruyordu — yavaş bağlantıda birkaç
    saniye "site bozuk" gibi görünüyordu. Bu katman uygulamanın kendi kâğıt
    zeminini ve simgesini gösterir; ilk kare çizilince (flutter-first-frame)
    solup kaldırılır. Renkler AppTheme.paper / dark ile aynı.
  -->
  <style>
    :root { --bg: #F3EFE3; --fg: #3B2A08; --muted: #7A6A4F; --mark: #7D5703; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0E0E11; --fg: #ECE6DA; --muted: #9A958C; --mark: #D9A441; }
    }
    html, body { margin: 0; height: 100%; background: var(--bg); }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity .35s ease; z-index: 10;
    }
    #splash.gone { opacity: 0; pointer-events: none; }
    #splash svg { width: 72px; height: 72px; animation: rise .6s ease-out both; }
    #splash h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: .2px; }
    #splash p { margin: 0; font-size: 14px; color: var(--muted); }
    #splash .bar {
      width: 120px; height: 3px; border-radius: 3px; overflow: hidden;
      background: color-mix(in srgb, var(--mark) 18%, transparent);
    }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%;
      background: var(--mark); border-radius: 3px;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      #splash svg, #splash .bar::after { animation: none; }
    }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-live="polite">
    <svg viewBox="13 7 50 67" aria-hidden="true">
      <path d="M13 7h33.5L63 23.5V69a5 5 0 0 1-5 5H18a5 5 0 0 1-5-5V12a5 5 0 0 1 5-5z" fill="var(--mark)"/>
      <path d="M46.5 7L63 23.5H50.5a4 4 0 0 1-4-4V7z" fill="var(--bg)"/>
      <path d="M25 35h26M25 47h26M25 59h15" stroke="var(--bg)" stroke-width="5.4" stroke-linecap="round"/>
    </svg>
    <h1>Notlar</h1>
    <div class="bar"></div>
    <p>Notların hazırlanıyor…</p>
  </div>
  <noscript>
    <p style="font-family: system-ui, sans-serif; text-align: center; padding: 24px;">
      Notlar'ı kullanmak için tarayıcında JavaScript'i etkinleştir.
    </p>
  </noscript>
  <script>
    // TEK AÇILIŞ KATMANI (F10.6, 2026-10-31): bu katman Flutter'ın ilk
    // karesinde değil, uygulama İLK ANLAMLI ekranını çizince ('notlar-ready',
    // bkz. lib/core/utils/web_ready.dart) kalkar — sessiz misafir girişi
    // sürerken çizilen ara ekran ile bu katman artık üst üste binmiyor. Bir
    // şey ters giderse ilk kareden 6 sn sonra yine kalkar.
    (function () {
      var s = document.getElementById('splash');
      var en = !/^tr\b/i.test(navigator.language || 'tr');
      if (en) {
        document.documentElement.lang = 'en';
        s.querySelector('h1').textContent = 'Notes';
        s.querySelector('p').textContent = 'Getting your notes ready…';
      }
      var gone = false;
      function hide() {
        if (gone || !s) return;
        gone = true;
        s.classList.add('gone');
        setTimeout(function () { s.remove(); }, 400);
      }
      window.addEventListener('notlar-ready', hide);
      window.addEventListener('flutter-first-frame', function () {
        setTimeout(hide, 6000);
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
