<!DOCTYPE html>
<html lang="tr">
<head>
  <!--
    $FLUTTER_BASE_HREF, `flutter build web --base-href` değeriyle değiştirilir.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Notlar — akıllı not defteri</title>
  <meta name="description" content="Notlar: telefon, tablet, bilgisayar ve web arasında anında senkron olan akıllı not defteri. Yapay zekâ asistanı, el yazısı, PDF üstüne not, notta YouTube videosu, çok sayfalı notlar, ortak notlar ve klasörler.">
  <meta name="application-name" content="Notlar">
  <meta name="theme-color" content="#EAF0EB" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131916" media="(prefers-color-scheme: dark)">

  <!-- Paylaşım önizlemesi (bağlantı mesajlaşmada/sosyal medyada açılınca) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Notlar">
  <meta property="og:title" content="Notlar — akıllı not defteri">
  <meta property="og:description" content="Her cihazda aynı notlar. Yapay zekâ asistanı, el yazısı, PDF üstüne not, notta YouTube videosu ve canlı ortak notlar.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta name="twitter:card" content="summary">

  <!-- iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Notlar">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png"/>
  <link rel="manifest" href="manifest.json">

  <!--
    HIZLI AÇILIŞ (kullanıcı isteği 2026-11-03): motor dosyaları (skwasm /
    CanvasKit, yedek yazı tipleri) gstatic'ten, oturum ve veri Firebase
    sunucularından gelir. Bağlantılar (DNS + TLS) Flutter'ın önyükleyicisi
    onları istemeden ÖNCE açılır; önyükleyici de gövdenin sonunu beklemeden
    başta indirilir (defer: sırası korunur, ayrıştırmayı durdurmaz).
  -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin>
  <link rel="preload" href="icons/Icon-192.png" as="image" fetchpriority="high">
  <script src="flutter_bootstrap.js" defer></script>

  <!--
    AÇILIŞ EKRANI (2026-09-22, web tasarımı): Flutter motoru indirilip ilk
    kareyi çizene kadar sayfa bembeyaz duruyordu — yavaş bağlantıda birkaç
    saniye "site bozuk" gibi görünüyordu. Bu katman uygulamanın kendi kâğıt
    zeminini ve simgesini gösterir; ilk kare çizilince (flutter-first-frame)
    solup kaldırılır. Renkler AppTheme Adaçayı açık / koyu ile aynı
    (TEMA_PLANI F35.2).
  -->
  <style>
    :root { --bg: #EAF0EB; --fg: #1B2420; --muted: #4D5853; --mark: #106561; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #131916; --fg: #E1E8E4; --muted: #B1BAB5; --mark: #76CDC5; }
    }
    html, body { margin: 0; height: 100%; background: var(--bg); }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity .2s ease; z-index: 10;
    }
    #splash.gone { opacity: 0; pointer-events: none; }
    /* Uygulamanın GERÇEK simgesi (i6, lacivert "N") — eski kahverengi sayfa
       çizimi 2026-10-19'daki simge değişikliğinde burada unutulmuştu. */
    #splash img {
      width: 88px; height: 88px; border-radius: 20px;
      box-shadow: 0 6px 20px rgba(19, 37, 74, .22);
      animation: rise .35s ease-out both;
    }
    #splash h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: .2px; }
    #splash p { margin: 0; font-size: 14px; color: var(--muted); }
    #splash .bar {
      width: 120px; height: 3px; border-radius: 3px; overflow: hidden;
      background: color-mix(in srgb, var(--mark) 18%, transparent);
    }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%;
      background: var(--mark); border-radius: 3px;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      #splash img, #splash .bar::after { animation: none; }
    }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" width="88" height="88" alt="" decoding="async" fetchpriority="high">
    <h1>Notlar</h1>
    <div class="bar"></div>
    <p>Notların hazırlanıyor…</p>
  </div>
  <noscript>
    <p style="font-family: system-ui, sans-serif; text-align: center; padding: 24px;">
      Notlar'ı kullanmak için tarayıcında JavaScript'i etkinleştir.
    </p>
  </noscript>
  <script>
    // TEK AÇILIŞ KATMANI (F10.6, 2026-10-31): bu katman Flutter'ın ilk
    // karesinde değil, uygulama İLK ANLAMLI ekranını çizince ('notlar-ready',
    // bkz. lib/core/utils/web_ready.dart) kalkar — sessiz misafir girişi
    // sürerken çizilen ara ekran ile bu katman artık üst üste binmiyor. Bir
    // şey ters giderse ilk kareden 6 sn sonra yine kalkar.
    (function () {
      var s = document.getElementById('splash');
      var en = !/^tr\b/i.test(navigator.language || 'tr');
      if (en) {
        document.documentElement.lang = 'en';
        s.querySelector('h1').textContent = 'Notes';
        s.querySelector('p').textContent = 'Getting your notes ready…';
      }
      var gone = false;
      function hide() {
        if (gone || !s) return;
        gone = true;
        s.classList.add('gone');
        setTimeout(function () { s.remove(); }, 250);
      }
      window.addEventListener('notlar-ready', hide);
      window.addEventListener('flutter-first-frame', function () {
        setTimeout(hide, 6000);
      });
    })();
  </script>
</body>
</html>
