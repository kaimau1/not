# BELLEK — CI runner'i 16 GB. Eski deger (-Xmx8G + 4G metaspace) tek basina
# yarisini istiyordu; buna Kotlin daemon, javac, Dart AOT ve R8 eklenince
# derlemenin en agir aninda (R8/dex, ~15. dakika) host bellegi tukeniyor ve
# runner "shutdown signal" ile geri aliniyor. Ust uste UC main derlemesi tam
# orada oldu (#168/#170/#171). Bu, kanitlanmis degil GUCLU BIR SUPHE: heap
# ve calisan sayisi runner'a sigacak sekilde kisildi. Yerelde de yeterli.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# Paralel calisan her gorev kendi JVM'ini buyutebiliyor; 4 vCPU'lu runner'da
# ucten fazlasi bellek kazaniyor, zaman kazandirmiyor.
org.gradle.workers.max=3
# Kotlin derleyici daemon'u AYRI bir JVM: kendi tavani verilmezse Gradle'in
# tavanini miras alip ikinci bir 4 GB'lik yigin aciyor.
kotlin.daemon.jvmargs=-Xmx1536m
# CI derlemesi tek modül olsa da birden fazla eklenti alt-modülü (Firebase,
# flutter_timezone, home_widget, pasteboard, record...) barindiriyor;
# paralel+önbellekli görev grafiği bunlarda gerçek kazanç sağlıyor.
org.gradle.parallel=true
org.gradle.caching=true
# CI'da dosya-izleme (VFS watch) gereksiz — yalnizca yerel artimli
# derlemelerde ise yarar. Loglarda "Already watching path" istisnasi verip
# derlemeyi kilitliyordu (Android is ~30 dk takildi); CI'da kapatilir.
org.gradle.vfs.watch=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
