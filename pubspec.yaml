name: notlar
description: "Firebase senkronlu, yapay zeka destekli not uygulaması (Android + web)."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  firebase_storage: ^13.4.5
  # Arkadaş aramada tüm kullanıcılar içinde arama: userSearch koleksiyonu
  # istemciden OKUNAMIYOR (bkz. firestore.rules), yalnız functions/searchUsers
  # callable'ı Admin SDK ile okuyup sınırlı sonuç döner.
  cloud_functions: ^6.1.1
  # Dahili AI ve Firestore'u sahte istemcilerden korur. Şu an yalnızca token
  # üretir (zorlama Firebase konsolundan AÇILMADI) — bkz. main.dart.
  firebase_app_check: ^0.4.1
  google_sign_in: ^7.2.0
  # Drive ek senkronunda yetki isteği HESAP E-POSTASIYLA yapılır (cihazda
  # birden çok Google hesabı varsa doğru Drive'a yazılsın) — bu ayrıntı
  # yalnız platform arayüzünde var (bkz. drive_store.dart).
  google_sign_in_platform_interface: ^3.1.0
  crypto: ^3.0.7
  url_launcher: ^6.3.2
  http: ^1.6.0
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  google_fonts: ^8.2.0
  flutter_displaymode: ^0.7.0
  cached_network_image: ^3.4.1
  image_picker: ^1.2.3
  # QR/barkod okuma: kamera önizlemesi + galeriden fotoğraf analizi
  # (analyzeImage). Web'de özellik gizlenir.
  mobile_scanner: ^7.4.0
  # Belge tarama: Google ML Kit Belge Tarayıcı'yı (kenar tespiti, perspektif
  # düzeltme, kontrast) sarar. Android/iOS eklentisi var, web'de YOK —
  # DocumentScan.supported false döner ve menüde hiç görünmez.
  cunning_document_scanner: ^1.2.3
  # Cihaz-içi OCR (ML Kit, Latin — Türkçe dahil): taranan sayfalara görünmez
  # metin katmanı (aranabilir PDF) ve akıllı belge adı için. İnternet gerekmez,
  # AI kotası harcamaz. Android/iOS; web'de ScanOcr.supported false döner.
  google_mlkit_text_recognition: ^0.15.0
  # Görüntülü not oynatma (yalnız cihazda saklanan videolar).
  video_player: ^2.9.2
  # YouTube videosunu uygulama İÇİNDE oynatır (gömülü oynatıcı + resim içinde
  # resim). Web'de iframe ile oynar.
  webview_flutter: ^4.14.1
  # Android'e özgü ayar: oynatıcı dokunuş beklemeden başlasın (otomatik oynatma).
  webview_flutter_android: ^4.14.1
  file_selector: ^1.1.0
  pasteboard: ^0.5.0
  pdfrx: ^2.6.6
  image: ^4.8.0
  flutter_secure_storage: ^10.3.1
  connectivity_plus: ^7.3.0
  uuid: ^4.6.0
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  # Uygulamanın kendi sürümünü OKUR (Ayarlar → Hakkında). Sürüm numarası
  # `pubspec.yaml`da sabit `1.0.0+1`; gerçek numarayı CI `--build-number` ile
  # geçiyor, yani derleme dışından bilinemiyor. Kullanıcı "hangi sürümdeyim"
  # sorusuna hiçbir yerde cevap bulamıyordu — güncelleme akışı "yeni APK'yı
  # üstüne kur" olduğu için bu bilgi hata bildirmenin de ön koşulu.
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  web: ^1.1.0
  path: ^1.9.1
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  record: ^7.1.1
  just_audio: ^0.10.6
  share_plus: ^13.2.1
  home_widget: ^0.9.3
  app_links: ^7.2.1
  firebase_ai: ^3.14.1
  local_auth: ^3.0.2
  receive_sharing_intent: ^1.9.0
  flutter_tts: ^4.2.5
  archive: ^4.0.9
  xml: ^7.0.1
  # PDF'e YAZMA (sayfa sil/döndür/sırala, çizimi belgeye gömme). Görüntüleme
  # pdfrx/pdfium'da KALIR — pdfrx salt-render, `pdf` paketi ise VAR OLAN bir
  # belgeyi açamıyor (yalnız sıfırdan üretiyor). Var olan PDF'i düzenlemenin
  # tek yolu bu; "dosya okuyucu" uygulamasında da 2026-07-23'ten beri aynı
  # ayrım var ve port oradan geldi.
  #
  # LİSANS: Syncfusion Community (birey/küçük ekip ücretsiz). PDF
  # kütüphanesi çalışma anında banner GÖSTERMEZ (o, SfPdfViewer gibi UI
  # widget'larına özgü) — biz yalnız bayt üreten API'yi kullanıyoruz.
  #
  # SÜRÜM TUZAĞI: 33.2.13'ten ESKİ seriler `xml ^6.5.0` istiyor, bizim
  # `xml ^7.0.1` ile çakışıyor (pptx/docx yolları xml 7 kullanıyor) —
  # "dosya okuyucu"daki 31.1.19 pini oradaki eski Flutter'a özgü, buraya
  # taşınamaz. İkisi BİRLİKTE yükseltilir: `pdf`in kısıtı core'u ayrı bir
  # seriye çekerse çözümleme sessizce ayrışır.
  syncfusion_flutter_pdf: ^33.2.13
  syncfusion_flutter_core: ^33.2.13
  # Çökme raporları (F1.9, 2026-10-19) — yalnız Android; web için
  # eklenti yok, orada yalnız cihazdaki hata günlüğü (core/error_log.dart).
  # Sürüm firebase_core 4.12.1 ile EŞ ZAMANLI yayın: daha yenisi core'u (ve
  # Android Firebase BoM'unu) öbür Firebase eklentilerinden ayırırdı.
  firebase_crashlytics: ^5.2.6
  firebase_messaging: ^16.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Kare ölçümü (F2.6): integration_test/perf_test.dart.
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  fake_cloud_firestore: ^4.3.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    # Uygulama içi Gizlilik Politikası ekranı bu dosyayı gösterir.
    - PRIVACY_POLICY.md
    # Uygulama içi KULLANIM KILAVUZU (dil başına; bkz. guide_screen.dart).
    - assets/guide/
    # Notu PDF'e aktarırken gömülen font. `pdf` paketinin hazır Helvetica'sı
    # WinAnsi kodlamalı, ı ğ ş İ harflerini İÇERMİYOR — Türkçe not bozuk
    # çıkıyordu. PT Sans (OFL) Türkçe'nin tamamını taşıyor.
    - assets/fonts/PTSans-Regular.ttf
    # KALIN ve İTALİK kesimler (aynı aile, OFL). Dışa aktarmada notun satır içi
    # biçimi de taşınsın diye eklendi (kullanıcı bulgusu 2026-08-08: "yazı
    # biçimi de aktarılmıyor"): `pdf` paketi kalın/italik'i SENTEZLEMEZ, o
    # kesimin kendi dosyası verilmezse metin düz çıkar.
    - assets/fonts/PTSans-Bold.ttf
    - assets/fonts/PTSans-Italic.ttf
    # YAZI TİPİ KATALOĞUNUN TAMAMI APK'ya GÖMÜLÜ (bkz. `note_fonts.dart`).
    #
    # KÖK NEDEN (kullanıcı, 2026-08-07: "yazı boyutu ve fontumuz tüm
    # telefonlarda sabit olmalı"): `google_fonts` yazı tipini ÇALIŞMA ANINDA
    # fonts.gstatic.com'dan indirir. İndirilemediğinde (ilk açılış çevrimdışı,
    # ağ kısıtlı, kurumsal DNS) metin sessizce CİHAZIN varsayılan yazı tipiyle
    # çizilir — Samsung One UI Sans, MIUI Sans, Roboto... hepsi başka metrik,
    # yani uygulama telefondan telefona başka görünür. Dosyalar burada
    # olduğunda paket İNDİRME YAPMADAN bunları kullanır (asset adı
    # `<Aile>-<Ağırlık>.ttf` olmak ZORUNDA, paket manifesti bu ada göre
    # tarıyor). 19 aile × 400/500 ağırlık ≈ 5,3 MB APK; karşılığında hem
    # uygulamanın hem notların yazı tipi seçimi çevrimdışı çalışıyor ve her
    # telefonda birebir aynı görünüyor.
    #
    # YALNIZ 400 (Regular) ve 500 (Medium): `...TextTheme` çağrıları gövde
    # temasındaki ağırlıkları yükler, Material 3 tipografisi de yalnız bu
    # ikisini kullanır. Arayüzdeki w600/w700 metinler bu iki yüzden
    # KALINLAŞTIRILARAK çiziliyor. Bir ailede 500 yoksa (Lato, PT Serif,
    # Merriweather, Patrick Hand) paket 400'e düşer — o yüzden tek dosyaları
    # var. Ağırlık eklemek gerekirse dosyayı EKLEMEK yetmez, `GoogleFonts`
    # çağrısında da karşılığı olmalı.
    #
    # Klasör bütün olarak bildirilir: yeni yazı tipi eklemek dosyayı buraya
    # koyup katalog haritalarına satır eklemekten ibaret olsun.
    - assets/google_fonts/

# Uygulama ikonu (i4, 2026-10-17 — Play'e hazır): kaynaklar
# `tool/gen_icon.py` ile üretilir (SVG → headless Chromium → PNG), sonra:
#   python3 tool/gen_icon.py && dart run flutter_launcher_icons
# Ön plan İNSETSİZ (adaptive_icon_foreground_inset: 0): işaret 108 birimlik
# tuvalde, ortadaki 66 birimlik GÜVENLİ DAİREDE tasarlandı (betik bunu
# doğrular). i3'ün %16 inset + büyük ölçeği daireyi aşıyor, yuvarlak maskede
# sayfa ve yıldız kırpılıyordu. Monokrom (Android 13+ temalı simge) katmanı
# araçta destekleniyor (0.14) — XML'e elle ekleme tuzağı KALKTI.
# Play Console simgesi: assets/icon/play_store_512.png (512, opak, tam kare;
# köşeyi ve gölgeyi Play ekler). Web simgeleri betikte üretilir.
flutter_launcher_icons:
  android: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
