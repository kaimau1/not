name: Derleme

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      perf:
        description: 'Kare ölçümü (emülatör, ~20 dk) — F2.6'
        type: boolean
        default: false

# Aynı dala arka arkaya push edilirse eskisi iptal edilir: iki ağır derleme
# yan yana koştuğunda runner'lardan biri geri alınıyor (aşağıya bak).
concurrency:
  group: derleme-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  # Derleme işareti ayrı, saniyelik bir işte okunur: APK işi testi BEKLEMEDEN
  # onunla paralel başlasın (eskiden test bitene dek ~7 dk sırada bekliyordu).
  marker:
    name: Derleme işareti
    runs-on: ubuntu-latest
    outputs:
      apk: ${{ steps.marker.outputs.apk }}
    steps:
      - uses: actions/checkout@v4

      # İşaret yalnız ilk satırda (commit BAŞLIĞI) aranır: gövdede işaretten
      # söz eden bir cümle derlemeyi istemeden tetikliyordu.
      - name: Derleme işaretini oku
        id: marker
        run: |
          title=$(git log -1 --pretty=%s)
          if [[ "$title" == *'[apk]'* ]]; then
            echo "apk=true" >> "$GITHUB_OUTPUT"
            echo "Başlıkta [apk] var → APK derlenecek."
          else
            echo "apk=false" >> "$GITHUB_OUTPUT"
            echo "Başlıkta [apk] yok → APK derlenmeyecek."
          fi

  test:
    name: Analiz + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Bağımlılıkları indir
        run: flutter pub get

      - name: Analiz
        run: flutter analyze

      # -j 4: package:test varsayılanı çekirdeklerin YARISI (4 vCPU'da 2).
      # Ölçüm (2026-10-19, 4 çekirdek): varsayılan ~200 sn, -j 4 ~90 sn.
      - name: Testler
        run: flutter test -j 4

  # GÜVENLİK KURALLARI (F4.9): Firestore emülatörüne karşı rules-test/ ve
  # Cloud Functions'ın saf testleri. Testle paralel; deploy ikisini de bekler
  # — kırmızı kural yayınlanmasın.
  rules:
    name: Kural + Functions testleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rules-test/package-lock.json
      - name: Emülatör önbelleği
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-v1
      - name: Firestore kuralları (emülatör)
        working-directory: rules-test
        run: npm ci --no-audit --no-fund && npm test
      - name: Functions saf testleri
        working-directory: functions
        run: node --test push.test.js search_match.test.js

  # APK yalnız elle tetiklenince (Actions → Run workflow) ya da MAIN'e giren
  # commit'in BAŞLIĞINDA [apk] geçince derlenir; dalda derlenmez (dal ile
  # main'in ağır işleri yan yana koşunca main'inki "runner has received a
  # shutdown signal" ile ölüyordu — 2026-08-01, üç koşu).
  #
  # TESTLE PARALEL: iş testi beklemez. Main'de Release TASLAK olarak
  # oluşturulur; `release` işi testler yeşilse onu yayınlar (bildirim maili
  # o anda gider), testler kırmızıysa taslağı siler. Test kırmızıyken
  # indirilebilir APK çıkmaz — eski sıralı düzenle aynı güvence.
  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: marker
    if: >
      (github.event_name == 'workflow_dispatch' && !inputs.perf) ||
      (github.ref == 'refs/heads/main' && needs.marker.outputs.apk == 'true')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Önbellek olmadan her derleme Gradle dağıtımını ve tüm AGP/Kotlin
      # bağımlılıklarını sıfırdan indirip çözümlüyordu (~5 dk); bu adım
      # Gradle görevi başlamadan önceki bu süreyi ortadan kaldırır.
      #
      # Geri yükleme ve KAYDETME bilerek AYRI adımlarda (actions/cache yerine
      # cache/restore + cache/save). KÖK NEDEN (2026-08-01, koşu #148): runner
      # uzun derlemenin ortasında kapatılınca ("The runner has received a
      # shutdown signal") post adımları HİÇ çalışmıyor, dolayısıyla önbellek
      # kaydedilmiyordu. Temmuz'daki önbellek de kullanılmadığı için düşmüştü;
      # her deneme sıfırdan indirip aynı duvara tosluyor, bir sonrakine hiçbir
      # şey bırakmıyordu. Kaydetme artık ısıtma adımının hemen ardında, uzun
      # derlemeden ÖNCE yapılır: derleme yarıda kesilse bile bir sonraki koşu
      # ısıtılmış önbellekle başlar.
      - name: Gradle önbelleğini geri yükle
        id: gradle_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Gradle YAPI önbelleği (görev çıktıları: Kotlin/Java derlemesi,
      # eklenti modülleri) ayrı tutulur ve HER başarılı derlemeden sonra
      # tazelenir — yukarıdaki bağımlılık önbelleği yalnız ilk ısıtmada
      # yazıldığı için derleme çıktılarını hiç taşımıyordu.
      - name: Gradle yapı önbelleğini geri yükle
        uses: actions/cache/restore@v4
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-bc-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            gradle-bc-${{ runner.os }}-

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Bağımlılıkları indir
        run: flutter pub get

      # Kalıcı imza: keystore GitHub Secrets'tan geri oluşturulur. Secrets
      # tanımlı değilse APK debug anahtarıyla imzalanır.
      - name: İmza anahtarını hazırla
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > android/app/notlar-release.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=notlar\nstoreFile=notlar-release.jks\n' \
              "$KEYSTORE_PASS" "$KEYSTORE_PASS" > android/key.properties
            echo "Kalıcı imza anahtarı hazırlandı."
          else
            echo "ANDROID_KEYSTORE_BASE64 tanımlı değil; debug imzası kullanılacak."
          fi

      # Gradle dağıtımını indirir ve bağımlılık grafiğini çözer, ama HİÇBİR
      # ŞEY derlemez (--config-only + --dry-run). Amacı önbelleği doldurup bir
      # sonraki adımdan önce kaydedilebilir hâle getirmek; asıl derleme
      # kesilse bile bu kazanç kalır.
      #
      # Önbellek zaten geri yüklendiyse ATLANIR (~6 dk kazanç). Koşul
      # `cache-hit` DEĞİL `cache-matched-key`: kaydetme anahtarı koşuya özel
      # olduğundan birebir isabet hiçbir zaman olmaz, önek eşleşmesi
      # (restore-keys) olur — `cache-hit` bu durumda 'false' döner ve ısıtma
      # boş yere her koşuda çalışırdı.
      - name: Gradle bağımlılıklarını ısıt
        if: steps.gradle_cache.outputs.cache-matched-key == ''
        continue-on-error: true
        run: |
          flutter build apk --release --config-only --target-platform android-arm64
          cd android && ./gradlew --no-daemon --dry-run assembleRelease

      - name: Isıtılmış Gradle önbelleğini kaydet
        if: steps.gradle_cache.outputs.cache-matched-key == ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          # Koşuya özel anahtar: aynı anahtar iki kez yazılamadığı için sabit
          # anahtar ikinci koşuda "zaten var" deyip kaydetmezdi. Geri yükleme
          # `gradle-${{ runner.os }}-` önekiyle en tazesini bulur.
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle*') }}-${{ github.run_id }}

      # GOOGLE_SERVER_CLIENT_ID reposunun Settings → Secrets kısmında tanımlıysa
      # Google girişi gömülü gelir; tanımlı değilse uygulama yine derlenir.
      # --build-number her derlemede artar; böylece yeni APK telefonda mevcut
      # sürümün üzerine sorunsuz kurulur.
      # --target-platform android-arm64: varsayılan "fat" APK üç mimari için
      # (arm64/armv7/x86_64) ayrı ayrı Dart AOT derlemesi yapıyordu; bu en
      # uzun tek adımdı ve CI'da zaman aşımına/iptale yol açıyordu. Neredeyse
      # tüm güncel telefonlar arm64 olduğundan tek mimariye indirmek AOT
      # derleme süresini ~1/3'e indirir.
      #
      # BOYUT: `--split-debug-info` Dart hata ayıklama bilgisini libapp.so'dan
      # ayırır (sembolik yığın izi uygulamada hiçbir yere gönderilmiyor).
      # pdfrx 2.x web motorunu (`pdfium.wasm`) yalnız web'e paketler
      # (`platforms: [web]`); 1.3.5 için pub önbelleğini yamalayan adım
      # kaldırıldı (F3.15).
      - name: APK derle
        run: >
          flutter build apk --release
          --target-platform android-arm64
          --split-debug-info=build/app/outputs/symbols
          --build-number=${{ github.run_number }}
          --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ secrets.GOOGLE_SERVER_CLIENT_ID }}

      - name: Gradle yapı önbelleğini kaydet
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-bc-${{ runner.os }}-${{ github.run_id }}

      # BOYUT RAPORU: APK'nın içinde hangi mimarilerin ve hangi büyük
      # dosyaların olduğunu yazar. 2026-08-16'da APK 60 MB'tan 100 MB'a
      # çıkınca (arm64'e indirilmiş olmasına RAĞMEN) nedeni loglardan
      # okunamadı — bu adım bir daha tahmin yürütmek zorunda kalmamak için.
      - name: APK içeriğini raporla
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          ls -l "$apk"
          echo "--- yerel kitaplık mimarileri ---"
          unzip -l "$apk" | awk '/ lib\// {split($4, p, "/"); print p[2]}' \
            | sort | uniq -c | sort -rn
          echo "--- mimari başına toplam bayt ---"
          unzip -l "$apk" | awk '/ lib\// {split($4, p, "/"); s[p[2]] += $1} \
            END {for (a in s) printf "%12d  %s\n", s[a], a}' | sort -rn
          echo "--- en büyük 25 girdi ---"
          unzip -l "$apk" | sort -rn | head -25
          # DENETİM: 32 bit / x86 kitaplığı sızarsa derleme DÜŞER.
          # Koşu #31951618844'te `abiFilters` sessizce işe yaramamış ve APK
          # üç mimariyle çıkmıştı; sessiz kalırsa bir daha fark edilmez.
          if unzip -l "$apk" | grep -qE ' lib/(x86|x86_64|armeabi|armeabi-v7a)/'; then
            echo "::error::APK istenmeyen mimari içeriyor (yalnız arm64-v8a olmalı)."
            exit 1
          fi
          echo "Yalnız arm64-v8a: doğrulandı."

      # AAB (Play App Bundle) derlemesi şimdilik DEVRE DIŞI: uygulama henüz
      # Play'e yüklenmediğinden her main derlemesini gereksiz ~2-3 dk
      # uzatıyordu. Play'e göndermeye hazır olunca aşağıdaki adımlar geri
      # eklenir: `flutter build appbundle --release` + upload-artifact (aab).
      # Şimdilik yalnızca APK derlenir ve Release yayınlanır.

      # main'e push'ta APK kalıcı bir Release olarak yayınlanır. Artifact'ten
      # farkı: doğrudan .apk linki (zip yok), süresi dolmaz, telefondan tıkla-kur.
      # GitHub yeni release için bildirim maili gönderir.
      # SIRA ÖNEMLİ — Release, artifact yüklemeden ÖNCE gelir.
      # KÖK NEDEN (2026-08-16, koşu #31950441604): deponun Actions artifact
      # DEPOLAMA kotası dolduğu için `upload-artifact` "Artifact storage quota
      # has been hit" ile düştü; adım zorunlu olduğundan (if-no-files-found:
      # error) iş orada kesildi ve Release ADIMI HİÇ ÇALIŞMADI. Yani APK
      # derlenmiş olmasına rağmen indirilebilir hiçbir kopya çıkmadı.
      # Release varlıkları artifact kotasından SAYILMIYOR; kalıcı ve doğrudan
      # indirilebilir olan da o. Artifact artık yalnızca bir kolaylık.
      - name: APK'yı sürüm numarasıyla adlandır
        if: github.ref == 'refs/heads/main'
        run: mv build/app/outputs/flutter-apk/app-release.apk notlar-v1.0.${{ github.run_number }}.apk

      - name: Release taslağı oluştur
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          target_commitish: ${{ github.sha }}
          tag_name: v1.0.${{ github.run_number }}
          name: Notlar v1.0.${{ github.run_number }}
          body: |
            Aşağıdaki **notlar-v1.0.${{ github.run_number }}.apk** dosyasına telefonundan
            tıkla, indir ve mevcut uygulamanın üzerine kur. Verilerin Firebase'de
            olduğu için hiçbir şey kaybolmaz. Bilgisayarda web sürümünü kullan
            (Cloudflare Pages, `notlar-web`).
          files: notlar-v1.0.${{ github.run_number }}.apk

      # Artifact YALNIZ elle tetiklenen (main dışı) koşuda: main'de teslimat
      # Release'tir. Depo artifact kotası dolu olabilir (2026-08-16'dan beri
      # sık sık "quota has been hit") — zorunlu değil, saklama 3 gün.
      - name: APK'yı yükle (elle tetiklenen koşu)
        if: github.ref != 'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: notlar-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 3
          if-no-files-found: warn

  # Testler yeşilse taslak Release yayınlanır, kırmızıysa silinir.
  release:
    name: Release yayınla
    runs-on: ubuntu-latest
    needs: [test, android]
    if: always() && github.ref == 'refs/heads/main' && needs.android.result == 'success'
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v1.0.${{ github.run_number }}
    steps:
      - name: Yayınla ya da sil
        run: |
          if [ "${{ needs.test.result }}" = "success" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          else
            echo "::error::Testler kırmızı — $TAG taslağı siliniyor."
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
            exit 1
          fi

  # main'e her push'ta Firestore/Storage kurallarını ve web sürümünü otomatik
  # yayınlar. Elle `firebase deploy` / `wrangler pages deploy` çalıştırmaya
  # gerek kalmaz.
  deploy:
    name: Firebase + Cloudflare Deploy
    runs-on: ubuntu-latest
    needs: [test, rules]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Bağımlılıkları indir
        run: flutter pub get

      - name: Web derle
        run: >
          flutter build web --release
          --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ secrets.GOOGLE_SERVER_CLIENT_ID }}

      - name: Firebase kurallarını yayınla
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-sa.json
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx firebase-tools deploy --only firestore,storage --non-interactive
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Cloud Functions bağımlılıklarını indir
        run: npm install --prefix functions

      # Kurallardan AYRI adım: Cloud Functions Blaze (ücretli) plan ister.
      # Proje henüz Blaze'e yükseltilmediyse bu adım başarısız olur ama
      # `continue-on-error` sayesinde geri kalan yayın (kurallar + web)
      # engellenmez — plan yükseltilince bir sonraki main push'unda
      # fonksiyon kendiliğinden yayınlanır, elle bir şey yapmaya gerek
      # kalmaz (kullanıcı isteği 2026-08-21: "otomatik deploy ediliyor
      # olması gerek").
      - name: Cloud Functions'ı yayınla (searchUsers)
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-sa.json
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx firebase-tools deploy --only functions --non-interactive
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"

      # KÖK NEDEN (deploy 2026-08-21'den beri KIRMIZI: "The constant
      # EventTarget must be initialized … functions/node_modules/
      # event-target-shim/index.d.ts"): `wrangler pages deploy`, ÇALIŞMA
      # DİZİNİNDEKİ `functions/` klasörünü **Cloudflare Pages Functions**
      # sanıp esbuild ile paketlemeye çalışıyor. Bu depodaki `functions/` ise
      # FIREBASE Cloud Functions — ad çakışması. Bir üstteki "Cloud Functions
      # bağımlılıklarını indir" adımı `functions/node_modules`ı doldurduğu an
      # (o adım 2026-08-21'de eklendi) paketleme patlıyor; web derlemesinin
      # kendisiyle hiç ilgisi yok.
      #
      # ÇÖZÜM: yayın `build/` dizininden koşuluyor — orada `functions/` yok,
      # wrangler Pages Functions aramayı bırakıyor. Yayınlanan içerik aynı
      # (`build/web`), yalnız yol göreli hâle geldi.
      - name: Cloudflare Pages'e yayınla
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: build
          command: pages deploy web --project-name=notlar-web --branch=main

  # KARE ÖLÇÜMÜ (F2.6): "kasma" bulgusu sayıyla izlensin. Emülatörde profil
  # kipinde integration_test/perf_test.dart (300 notlu ızgarada fırlatma +
  # editörde 200 karakter); özet `perf-summary` artefaktında, p90 build
  # > 8 ms ise iş kırmızı. Dakika kotası yüzünden YALNIZ elle:
  # Actions → Derleme → Run workflow → "Kare ölçümü" kutusu.
  # Not: emülatör yazılım GPU'su kullanır — raster süreleri gerçek cihazdan
  # kötüdür; karşılaştırma koşudan koşuya yapılmalı, mutlak değerle değil.
  perf:
    name: Kare ölçümü
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.perf
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: KVM'i aç (emülatör hızlandırma)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Bağımlılıkları indir
        run: flutter pub get

      - name: Emülatörde ölç
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: flutter drive --profile --driver=test_driver/perf_driver.dart --target=integration_test/perf_test.dart -d emulator-5554

      - name: Özeti yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-summary
          path: build/perf/
