name: Derleme

on:
  push:
    branches: ['**']
  workflow_dispatch:

# Aynı dala arka arkaya push edilirse eskisi iptal edilir: iki ağır derleme
# yan yana koştuğunda runner'lardan biri geri alınıyor (aşağıya bak).
concurrency:
  group: derleme-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.6'

jobs:
  test:
    name: Analiz + Test
    runs-on: ubuntu-latest
    outputs:
      apk: ${{ steps.marker.outputs.apk }}
    steps:
      - uses: actions/checkout@v4

      # KÖK NEDEN: işaret eskiden `contains(head_commit.message, '[apk]')` ile
      # aranıyordu ve o ifade commit mesajının TAMAMINA (gövde dahil) bakar.
      # Gövdede işaretten SÖZ EDEN bir cümle ("[apk] yok" gibi) derlemeyi
      # istemeden tetikliyordu. Artık yalnız ilk satıra (commit BAŞLIĞI)
      # bakılıyor; gövdede işaretten serbestçe söz edilebilir.
      - name: Derleme işaretini oku
        id: marker
        run: |
          title=$(git log -1 --pretty=%s)
          if [[ "$title" == *'[apk]'* ]]; then
            echo "apk=true" >> "$GITHUB_OUTPUT"
            echo "Başlıkta [apk] var → APK derlenecek."
          else
            echo "apk=false" >> "$GITHUB_OUTPUT"
            echo "Başlıkta [apk] yok → APK derlenmeyecek."
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Bağımlılıkları indir
        run: flutter pub get

      - name: Analiz
        run: flutter analyze

      - name: Testler
        run: flutter test

  # Her push'ta APK derlemek CI dakikalarını boşa yakıyordu (~15 dk/derleme).
  # Artık yalnızca elle tetiklenince (Actions → Run workflow) ya da MAIN'e
  # giren commit'in mesajında [apk] geçince derlenir. Analiz+Test her push'ta
  # çalışmaya devam eder.
  #
  # DALDA DERLENMEZ. Gözlem (2026-08-01, üç koşu): dal ile main'in APK işleri
  # yan yana koştuğunda main'inki "runner has received a shutdown signal" ile
  # ölüyor, dalınki bitiyor — main'de yalnız tek başına koşan derleme (#153)
  # tamamlandı. Nedeni kesin bilinmiyor (runner tarafı), ama dalda üretilen APK
  # zaten hiçbir yere gitmiyordu: sürüm main'den yayınlanıyor. İkinci ağır işi
  # kaldırmak hem bu çakışmayı hem de boşa giden ~12 dk'yı ortadan kaldırır.
  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: test
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.ref == 'refs/heads/main' && needs.test.outputs.apk == 'true')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Önbellek olmadan her derleme Gradle dağıtımını ve tüm AGP/Kotlin
      # bağımlılıklarını sıfırdan indirip çözümlüyordu (~5 dk); bu adım
      # Gradle görevi başlamadan önceki bu süreyi ortadan kaldırır.
      #
      # Geri yükleme ve KAYDETME bilerek AYRI adımlarda (actions/cache yerine
      # cache/restore + cache/save). KÖK NEDEN (2026-08-01, koşu #148): runner
      # uzun derlemenin ortasında kapatılınca ("The runner has received a
      # shutdown signal") post adımları HİÇ çalışmıyor, dolayısıyla önbellek
      # kaydedilmiyordu. Temmuz'daki önbellek de kullanılmadığı için düşmüştü;
      # her deneme sıfırdan indirip aynı duvara tosluyor, bir sonrakine hiçbir
      # şey bırakmıyordu. Kaydetme artık ısıtma adımının hemen ardında, uzun
      # derlemeden ÖNCE yapılır: derleme yarıda kesilse bile bir sonraki koşu
      # ısıtılmış önbellekle başlar.
      - name: Gradle önbelleğini geri yükle
        id: gradle_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Bağımlılıkları indir
        run: flutter pub get

      # Kalıcı imza: keystore GitHub Secrets'tan geri oluşturulur. Secrets
      # tanımlı değilse APK debug anahtarıyla imzalanır.
      - name: İmza anahtarını hazırla
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > android/app/notlar-release.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=notlar\nstoreFile=notlar-release.jks\n' \
              "$KEYSTORE_PASS" "$KEYSTORE_PASS" > android/key.properties
            echo "Kalıcı imza anahtarı hazırlandı."
          else
            echo "ANDROID_KEYSTORE_BASE64 tanımlı değil; debug imzası kullanılacak."
          fi

      # Gradle dağıtımını indirir ve bağımlılık grafiğini çözer, ama HİÇBİR
      # ŞEY derlemez (--config-only + --dry-run). Amacı önbelleği doldurup bir
      # sonraki adımdan önce kaydedilebilir hâle getirmek; asıl derleme
      # kesilse bile bu kazanç kalır.
      #
      # Önbellek zaten geri yüklendiyse ATLANIR (~6 dk kazanç). Koşul
      # `cache-hit` DEĞİL `cache-matched-key`: kaydetme anahtarı koşuya özel
      # olduğundan birebir isabet hiçbir zaman olmaz, önek eşleşmesi
      # (restore-keys) olur — `cache-hit` bu durumda 'false' döner ve ısıtma
      # boş yere her koşuda çalışırdı.
      - name: Gradle bağımlılıklarını ısıt
        if: steps.gradle_cache.outputs.cache-matched-key == ''
        continue-on-error: true
        run: |
          flutter build apk --release --config-only --target-platform android-arm64
          cd android && ./gradlew --no-daemon --dry-run assembleRelease

      - name: Isıtılmış Gradle önbelleğini kaydet
        if: steps.gradle_cache.outputs.cache-matched-key == ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          # Koşuya özel anahtar: aynı anahtar iki kez yazılamadığı için sabit
          # anahtar ikinci koşuda "zaten var" deyip kaydetmezdi. Geri yükleme
          # `gradle-${{ runner.os }}-` önekiyle en tazesini bulur.
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle*') }}-${{ github.run_id }}

      # GOOGLE_SERVER_CLIENT_ID reposunun Settings → Secrets kısmında tanımlıysa
      # Google girişi gömülü gelir; tanımlı değilse uygulama yine derlenir.
      # --build-number her derlemede artar; böylece yeni APK telefonda mevcut
      # sürümün üzerine sorunsuz kurulur.
      # --target-platform android-arm64: varsayılan "fat" APK üç mimari için
      # (arm64/armv7/x86_64) ayrı ayrı Dart AOT derlemesi yapıyordu; bu en
      # uzun tek adımdı ve CI'da zaman aşımına/iptale yol açıyordu. Neredeyse
      # tüm güncel telefonlar arm64 olduğundan tek mimariye indirmek AOT
      # derleme süresini ~1/3'e indirir.
      - name: APK derle
        run: >
          flutter build apk --release
          --target-platform android-arm64
          --build-number=${{ github.run_number }}
          --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ secrets.GOOGLE_SERVER_CLIENT_ID }}

      # BOYUT RAPORU: APK'nın içinde hangi mimarilerin ve hangi büyük
      # dosyaların olduğunu yazar. 2026-08-16'da APK 60 MB'tan 100 MB'a
      # çıkınca (arm64'e indirilmiş olmasına RAĞMEN) nedeni loglardan
      # okunamadı — bu adım bir daha tahmin yürütmek zorunda kalmamak için.
      - name: APK içeriğini raporla
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          ls -l "$apk"
          echo "--- yerel kitaplık mimarileri ---"
          unzip -l "$apk" | awk '/ lib\// {split($4, p, "/"); print p[2]}' \
            | sort | uniq -c | sort -rn
          echo "--- mimari başına toplam bayt ---"
          unzip -l "$apk" | awk '/ lib\// {split($4, p, "/"); s[p[2]] += $1} \
            END {for (a in s) printf "%12d  %s\n", s[a], a}' | sort -rn
          echo "--- en büyük 25 girdi ---"
          unzip -l "$apk" | sort -rn | head -25

      # AAB (Play App Bundle) derlemesi şimdilik DEVRE DIŞI: uygulama henüz
      # Play'e yüklenmediğinden her main derlemesini gereksiz ~2-3 dk
      # uzatıyordu. Play'e göndermeye hazır olunca aşağıdaki adımlar geri
      # eklenir: `flutter build appbundle --release` + upload-artifact (aab).
      # Şimdilik yalnızca APK derlenir ve Release yayınlanır.

      # main'e push'ta APK kalıcı bir Release olarak yayınlanır. Artifact'ten
      # farkı: doğrudan .apk linki (zip yok), süresi dolmaz, telefondan tıkla-kur.
      # GitHub yeni release için bildirim maili gönderir.
      # SIRA ÖNEMLİ — Release, artifact yüklemeden ÖNCE gelir.
      # KÖK NEDEN (2026-08-16, koşu #31950441604): deponun Actions artifact
      # DEPOLAMA kotası dolduğu için `upload-artifact` "Artifact storage quota
      # has been hit" ile düştü; adım zorunlu olduğundan (if-no-files-found:
      # error) iş orada kesildi ve Release ADIMI HİÇ ÇALIŞMADI. Yani APK
      # derlenmiş olmasına rağmen indirilebilir hiçbir kopya çıkmadı.
      # Release varlıkları artifact kotasından SAYILMIYOR; kalıcı ve doğrudan
      # indirilebilir olan da o. Artifact artık yalnızca bir kolaylık.
      - name: APK'yı sürüm numarasıyla adlandır
        if: github.ref == 'refs/heads/main'
        run: mv build/app/outputs/flutter-apk/app-release.apk notlar-v1.0.${{ github.run_number }}.apk

      - name: Release yayınla
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Notlar v1.0.${{ github.run_number }}
          body: |
            Aşağıdaki **notlar-v1.0.${{ github.run_number }}.apk** dosyasına telefonundan
            tıkla, indir ve mevcut uygulamanın üzerine kur. Verilerin Firebase'de
            olduğu için hiçbir şey kaybolmaz.

            Windows sürümü artık CI'da derlenmiyor (gereksiz yavaşlıktı). Gerektiğinde
            depo kökündeki **build-windows.bat** dosyasını çalıştırarak masaüstünde
            derleyebilirsin.
          files: notlar-v1.0.${{ github.run_number }}.apk

      # Artifact yükleme ARTIK ZORUNLU DEĞİL (continue-on-error): depo
      # kotası dolduğunda tek başına bütün işi düşürüyordu. Asıl teslimat
      # yolu yukarıdaki Release; bu adım yalnız elle tetiklenen (main dışı)
      # koşularda işe yarıyor, çünkü orada Release yayınlanmıyor.
      - name: APK'yı yükle (kotaya bağlı, zorunlu değil)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: notlar-android-apk
          path: |
            notlar-v1.0.${{ github.run_number }}.apk
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
