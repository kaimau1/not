name: Derleme

on:
  push:
    branches: ['**']
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.44.6'

jobs:
  test:
    name: Analiz + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Bağımlılıkları indir
        run: flutter pub get

      - name: Analiz
        run: flutter analyze

      - name: Testler
        run: flutter test

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Bağımlılıkları indir
        run: flutter pub get

      # Kalıcı imza: keystore GitHub Secrets'tan geri oluşturulur. Secrets
      # tanımlı değilse bu adım atlanır ve APK debug anahtarıyla imzalanır.
      - name: İmza anahtarını hazırla
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/notlar-release.jks
          {
            echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "keyAlias=notlar"
            echo "storeFile=notlar-release.jks"
          } > android/key.properties

      # GOOGLE_SERVER_CLIENT_ID reposunun Settings → Secrets kısmında tanımlıysa
      # Google girişi gömülü gelir; tanımlı değilse uygulama yine derlenir.
      # --build-number her derlemede artar; böylece yeni APK telefonda mevcut
      # sürümün üzerine sorunsuz kurulur.
      - name: APK derle
        run: >
          flutter build apk --release
          --build-number=${{ github.run_number }}
          --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ secrets.GOOGLE_SERVER_CLIENT_ID }}

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: notlar-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Bağımlılıkları indir
        run: flutter pub get

      - name: Windows derle
        run: >
          flutter build windows --release
          --build-number=${{ github.run_number }}
          --dart-define=GOOGLE_DESKTOP_CLIENT_ID=${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          --dart-define=GOOGLE_DESKTOP_CLIENT_SECRET=${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}

      - name: Windows çıktısını yükle
        uses: actions/upload-artifact@v4
        with:
          name: notlar-windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
